name: training_platform
description: "Cross-platform training management system built with Flutter"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0
  
  # Navigation
  go_router: ^11.1.0
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.0
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  firebase_storage: ^11.5.0
  
  # UI Components
  cupertino_icons: ^1.0.2
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  get_it: ^7.6.0
  
  # Drag & Drop
  flutter_reorderable_grid: ^0.3.2
  multi_select_flutter: ^4.1.3
  
  # Media Handling
  image_picker: ^1.0.4
  video_player: ^2.7.2
  chewie: ^1.7.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  freezed_annotation: ^2.4.1
  json_serializable: ^6.7.1
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.5
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - .env
